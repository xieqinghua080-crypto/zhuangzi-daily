<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F5F0E8;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"PingFang SC","Helvetica Neue",sans-serif}
.ipad{width:2064px;height:2752px;background:#F5F0E8;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.card{width:1600px;background:#FFFFFF;border-radius:60px;padding:120px;box-shadow:0 20px 80px rgba(0,0,0,0.08);display:flex;flex-direction:column;align-items:center}
.badge{display:inline-block;background:#E8E0D0;color:#8B7355;font-size:36px;padding:16px 40px;border-radius:40px;margin-bottom:60px;font-weight:500;letter-spacing:4px}
.quote{font-size:72px;line-height:1.5;color:#2C2C2C;text-align:center;margin-bottom:40px;}
.source{font-size:40px;color:#8B7355;text-align:center}
.line{width:80px;height:3px;background:#D4C5A9;margin:40px auto}
.advice{font-size:48px;line-height:1.6;color:#5A5A5A;text-align:center;font-weight:300}
.bar{position:absolute;bottom:100px;left:0;right:0;display:flex;justify-content:space-between;padding:0 160px;align-items:center}
.logo{font-size:44px;color:#8B7355;font-weight:600;letter-spacing:6px}
.date{font-size:36px;color:#B0A090}
.tag{background:#2C2C2C;color:#F5F0E8;font-size:40px;padding:20px 50px;border-radius:50px}
</style></head><body>
<div class="ipad">
  <div class="card">
    <div class="badge">✦ 今日签</div>
    <div class="quote">「吾生也有涯，而知也无涯。」</div>
    <div class="source">——《庄子·养生主》</div>
    <div class="line"></div>
    <div class="advice">你的注意力是有限的，别把它浪费在<br>无关紧要的事情上。今天，专注在<br>一件真正重要的事上。</div>
  </div>
  <div class="bar">
    <div class="logo">庄子的每日签</div>
    <div class="date">2026.5.16</div>
    <div class="tag">✧ 今日</div>
  </div>
</div>
</body></html>
