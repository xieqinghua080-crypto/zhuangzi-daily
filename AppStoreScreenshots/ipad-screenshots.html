<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F5F0E8;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:"PingFang SC","Helvetica Neue",sans-serif}
.ipad{width:2064px;height:2752px;background:#F5F0E8;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}

/* Card */
.card{width:1600px;background:#FFFFFF;border-radius:60px;padding:120px;box-shadow:0 20px 80px rgba(0,0,0,0.08);position:relative;display:flex;flex-direction:column;align-items:center}
.badge{display:inline-block;background:#E8E0D0;color:#8B7355;font-size:36px;padding:16px 40px;border-radius:40px;margin-bottom:60px;font-weight:500;letter-spacing:4px}
.quote{font-size:72px;line-height:1.5;color:#2C2C2C;text-align:center;font-weight:400;margin-bottom:40px;max-width:1400px}
.source{font-size:40px;color:#8B7355;text-align:center;letter-spacing:2px}
.line{width:80px;height:3px;background:#D4C5A9;margin:40px auto}
.advice{font-size:48px;line-height:1.6;color:#5A5A5A;text-align:center;font-weight:300;max-width:1400px}

/* Bottom bar */
.bar{position:absolute;bottom:100px;left:0;right:0;display:flex;justify-content:space-between;padding:0 160px;align-items:center}
.logo{font-size:44px;color:#8B7355;font-weight:600;letter-spacing:6px}
.date{font-size:36px;color:#B0A090}
.tag{background:#2C2C2C;color:#F5F0E8;font-size:40px;padding:20px 50px;border-radius:50px}
/* page2 - library */
.lib-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:80px 160px}
.lib-card{background:#FFFFFF;border-radius:40px;padding:60px;box-shadow:0 8px 30px rgba(0,0,0,0.06)}
.lib-badge{display:inline-block;background:#E8E0D0;color:#8B7355;font-size:28px;padding:12px 30px;border-radius:30px;margin-bottom:24px}
.lib-quote{font-size:44px;line-height:1.4;color:#2C2C2C;margin-bottom:16px}
.lib-source{font-size:32px;color:#8B7355}
</style></head><body>

<!-- Screenshot 1: Today's Sign -->
<div class="ipad">
  <div class="card">
    <div class="badge">✦ 今日签</div>
    <div class="quote">「吾生也有涯，而知也无涯。」</div>
    <div class="source">——《庄子·养生主》</div>
    <div class="line"></div>
    <div class="advice">你的注意力是有限的，别把它浪费在无关紧要的事情上。今天，专注在一件真正重要的事上。</div>
  </div>
  <div class="bar">
    <div class="logo">庄子的每日签</div>
    <div class="date">2026年5月16日</div>
    <div class="tag">✧ 今日</div>
  </div>
</div>

<!-- Screenshot 2: Sign Library -->
<div class="ipad" style="margin-top:60px">
  <div style="position:absolute;top:60px;left:160px;font-size:48px;color:#2C2C2C;font-weight:600">签库</div>
  <div style="position:absolute;top:60px;right:160px;background:#2C2C2C;color:white;font-size:36px;padding:14px 40px;border-radius:40px">订阅后解锁全部</div>
  <div class="lib-grid" style="margin-top:140px">
    <div class="lib-card"><div class="lib-badge">养生主·三</div><div class="lib-quote">「缘督以为经」</div><div class="lib-source">顺中道以为常法</div></div>
    <div class="lib-card"><div class="lib-badge">逍遥游·一</div><div class="lib-quote">「北冥有鱼」</div><div class="lib-source">开篇即见大境界</div></div>
    <div class="lib-card"><div class="lib-badge">齐物论·十二</div><div class="lib-quote">「天地与我并生」</div><div class="lib-source">万物与我为一</div></div>
    <div class="lib-card"><div class="lib-badge">人间世·八</div><div class="lib-quote">「人皆知有用之用」</div><div class="lib-source">无用之用，方为大用</div></div>
  </div>
</div>

<!-- Screenshot 3: Settings -->
<div class="ipad" style="margin-top:60px">
  <div style="position:absolute;top:60px;left:160px;font-size:48px;color:#2C2C2C;font-weight:600">设置</div>
  <div style="margin-top:140px;width:1744px;background:white;border-radius:50px;padding:60px 100px;box-shadow:0 8px 30px rgba(0,0,0,0.06)">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:40px 0;border-bottom:1px solid #EEE">
      <div><div style="font-size:40px;color:#2C2C2C">推送时间</div><div style="font-size:32px;color:#999">每天早上通知</div></div>
      <div style="font-size:36px;color:#8B7355">07:00</div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:40px 0;border-bottom:1px solid #EEE">
      <div><div style="font-size:40px;color:#2C2C2C">字体</div><div style="font-size:32px;color:#999">选择签名风格</div></div>
      <div style="font-size:36px;color:#8B7355">楷体 ›</div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:40px 0;border-bottom:1px solid #EEE">
      <div><div style="font-size:40px;color:#2C2C2C">深色模式</div><div style="font-size:32px;color:#999">跟随系统</div></div>
      <div style="width:80px;height:44px;background:#D4C5A9;border-radius:22px;position:relative"></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:40px 0">
      <div><div style="font-size:40px;color:#2C2C2C">管理订阅</div><div style="font-size:32px;color:#999">¥22.00/月</div></div>
      <div style="font-size:36px;color:#8B7355">›</div>
    </div>
  </div>
  <div style="position:absolute;bottom:100px;text-align:center;color:#B0A090;font-size:36px">
    订阅后可解锁全部 81 签 · 每日推送 · 无广告
  </div>
</div>

</body></html>
